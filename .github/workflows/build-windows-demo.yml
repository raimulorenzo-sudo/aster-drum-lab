name: Build Windows VST3 Demo

on:
  workflow_dispatch:
  push:
    branches:
      - codex/v1.0.0-windows-aax-handoff
    paths:
      - ".github/workflows/build-windows-demo.yml"
      - "CMakeLists.txt"
      - "Source/**"
      - "Tests/**"
      - "packaging/demo/**"
      - "packaging/windows/build-installer.ps1"
      - "ui-prototype/package.json"
      - "ui-prototype/package-lock.json"
      - "ui-prototype/src/**"
      - "ui-prototype/index.html"
      - "ui-prototype/tsconfig*.json"
      - "ui-prototype/vite.config.ts"

permissions:
  contents: read

concurrency:
  group: windows-vst3-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 VST3 Demo
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui-prototype/package-lock.json

      - name: Build and test unsigned VST3 Demo
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -Demo -SkipInstaller -BuildTests -Unsigned

      - name: Verify Demo output
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem dist/ASTER-Drum-Lab-*-Demo-Windows-x64-VST3.zip)
          if ($archives.Count -ne 1) {
            throw "Expected one Demo VST3 archive, found $($archives.Count)."
          }
          if ($archives[0].Length -lt 1MB) {
            throw "Demo VST3 archive is unexpectedly small: $($archives[0].Length) bytes."
          }
          if (-not (Test-Path "$($archives[0].FullName).sha256")) {
            throw "Demo VST3 checksum is missing."
          }
          Get-FileHash -Algorithm SHA256 $archives[0].FullName

      - name: Upload Windows VST3 Demo
        uses: actions/upload-artifact@v7
        with:
          name: ASTER-Drum-Lab-Windows-x64-VST3-Demo
          path: |
            dist/ASTER-Drum-Lab-*-Demo-Windows-x64-VST3.zip
            dist/ASTER-Drum-Lab-*-Demo-Windows-x64-VST3.zip.sha256
          if-no-files-found: error
          retention-days: 14
